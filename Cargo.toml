[package]
name = "credence-contracts"
version.workspace = true
edition.workspace = true
publish = false
autobins = false
autoexamples = false
autobenches = false
autotests = false

[[test]]
name = "e2e_protocol_lifecycle"
path = "tests/e2e_protocol_lifecycle.rs"

[workspace]
resolver = "2"
members = [
    "contracts/admin",
    "contracts/arbitration",
    "contracts/bounty-escrow",
    "contracts/credence_bond",
    "contracts/credence_delegation",
    "contracts/credence_errors",
    "contracts/credence_math",
    "contracts/credence_multisig",
    "contracts/credence_registry",
    "contracts/credence_treasury",
    "contracts/dispute_resolution",
    "contracts/fixed_duration_bond",
    "contracts/templates",
    "contracts/timelock",
    "crates/interfaces",
    "crates/testutils",
    "crates/credence_admin_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[dev-dependencies]
credence_arbitration = { path = "contracts/arbitration" }
credence_bond = { path = "contracts/credence_bond", features = ["testutils"] }
credence_registry = { path = "contracts/credence_registry" }
credence_treasury = { path = "contracts/credence_treasury" }
soroban-sdk = { version = "22.0", features = ["testutils"] }
