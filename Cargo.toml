[workspace]
resolver = "2"
members = [
    "contracts/admin",
    "contracts/arbitration",
    "contracts/bounty-escrow",
    "contracts/credence_bond",
    "contracts/credence_delegation",
    "contracts/credence_errors",
    "contracts/credence_math",
    "contracts/credence_multisig",
    "contracts/credence_registry",
    "contracts/credence_treasury",
    "contracts/dispute_resolution",
    "contracts/fixed_duration_bond",
    "contracts/templates",
    "contracts/timelock",
    "crates/interfaces",
    "crates/testutils",
    "crates/credence_admin_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
