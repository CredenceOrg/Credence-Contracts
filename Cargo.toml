[package]
name = "credence-contracts"
version.workspace = true
edition.workspace = true

[workspace]
resolver = "2"
members = ["contracts/credence_bond", "contracts/dispute_resolution", "contracts/credence_delegation", "contracts/credence_registry", "contracts/credence_treasury", "contracts/timelock", "contracts/arbitration", "contracts/credence_multisig", "contracts/admin", "contracts/credence_errors", "contracts/credence_math", "contracts/fixed_duration_bond", "contracts/templates", "crates/credence_admin_cli", "crates/testutils", "crates/interfaces"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
debug = 0

[profile.test]
debug = 0

