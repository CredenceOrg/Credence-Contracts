[package]
name = "dispute_resolution"
version = "0.1.0"
edition = "2021"

[lib]
# rlib is required alongside cdylib so integration tests (and any off-chain
# tooling) can link the crate as a normal Rust dependency.  The cdylib artifact
# used for the on-chain WASM is unaffected.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { version = "22.0", default-features = false }
# Shared cross-contract client and mirrored arbitration types. They live in
# `interfaces` (not in `credence_arbitration`) so this contract can read an
# arbitration ruling without taking a hard dependency edge on a sibling
# contract.
interfaces = { path = "../../crates/interfaces" }

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }
# Integration tests register the real arbitration contract on the same ledger
# to prove arbitration-backed resolution works end to end.
credence_arbitration = { path = "../arbitration" }

[features]
default = []
# Enable testutils APIs (Address::generate, mock_all_auths, generated client,
# etc.) for off-chain tooling and integration tests.  Must NOT be enabled when
# building the release WASM.
testutils = ["soroban-sdk/testutils"]
