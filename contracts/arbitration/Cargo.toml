[package]
name = "credence_arbitration"
version = "0.1.0"
edition = "2021"
description = "Credence arbitration voting system — weighted voting for dispute resolution"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = "22.0"
credence_errors = { path = "../credence_errors" }
interfaces = { path = "../../crates/interfaces" }

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }
testutils = { path = "../../crates/testutils" }

[features]
default = []
# Enable testutils APIs for off-chain tooling and integration tests. Must NOT be
# enabled when building the release WASM.
testutils = ["soroban-sdk/testutils"]
