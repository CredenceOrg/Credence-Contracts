name: Contracts Tests

on:
  push:
    branches:
      - main
      - master
      - develop
      - ci/**
    paths:
      - Cargo.toml
      - Cargo.lock
      - contracts/**
      - .github/workflows/contracts-tests.yml
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - Cargo.toml
      - Cargo.lock
      - contracts/**
      - .github/workflows/contracts-tests.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compile workspace test harnesses
        run: cargo test --workspace --no-run

      - name: Run maintained integration tests
        run: |
          cargo test --package credence-contracts \
            --test signature_domains_unique \
            --test threats_link
          cargo test --package credence_bond \
            --test proptest_tier \
            --test proptest_batch_atomicity \
            --test test_cost_regression
          cargo test --package credence_delegation \
            --test auth_tree_fuzz \
            --test datakey_fingerprint \
            --test nonce_replay \
            --test spec_xdr_regression
          cargo test --package credence_errors \
            --test discriminant_uniqueness \
            --test error_codes_wire
          cargo test --package credence_arbitration \
            --test datakey_fingerprint \
            --test test_weight_derivation
          cargo test --package admin --test datakey_fingerprint
          cargo test --package credence_admin_cli --test integration_test
