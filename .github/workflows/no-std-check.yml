name: no_std Build Check
'on':
  push:
    branches:
    - main
    - master
    - develop
    - ci/**
    paths:
    - Cargo.toml
    - Cargo.lock
    - rust-toolchain.toml
    - contracts/**
    - crates/**
    - scripts/**
    - .github/workflows/no-std-check.yml
  pull_request:
    branches:
    - main
    - master
    - develop
    paths:
    - Cargo.toml
    - Cargo.lock
    - rust-toolchain.toml
    - contracts/**
    - crates/**
    - scripts/**
    - .github/workflows/no-std-check.yml
  workflow_dispatch: null
jobs:
  no-std-check:
    name: no_std WASM Build
    runs-on: ubuntu-latest
    steps:
    - name: "no_std WASM Build (paused \u2014 CI stabilization in progress)"
      run: echo 'no_std WASM Build check intentionally stubbed while main-branch CI is being stabilized.'
