name: no_std Build Check

on:
  push:
    branches:
      - main
      - master
      - develop
      - ci/**
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - contracts/**
      - .github/workflows/no-std-check.yml
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - contracts/**
      - .github/workflows/no-std-check.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  no-std-check:
    name: no_std WASM Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build contracts for WASM (no_std compliance check)
        run: cargo build --target wasm32-unknown-unknown --release --all-features
