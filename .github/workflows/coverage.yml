name: Coverage

on:
  push:
    branches: [main, master, develop, 'feature/**']
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Per-crate coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + llvm-tools)
        run: |
          rustup toolchain install stable --profile minimal \
            --component llvm-tools-preview
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-coverage-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage — credence_bond
        run: |
          cargo llvm-cov --no-cfg-coverage --package credence_bond \
            --test proptest_tier \
            --test proptest_batch_atomicity \
            --test test_cost_regression \
            --lcov --output-path lcov-credence_bond.info

      - name: Coverage — credence_delegation
        run: |
          cargo llvm-cov --no-cfg-coverage --package credence_delegation \
            --test auth_tree_fuzz \
            --test datakey_fingerprint \
            --test nonce_replay \
            --test spec_xdr_regression \
            --lcov --output-path lcov-credence_delegation.info

      - name: Coverage — timelock
        run: |
          cargo llvm-cov --no-cfg-coverage --package timelock \
            --lcov --output-path lcov-timelock.info

      - name: Coverage — credence_errors
        run: |
          cargo llvm-cov --no-cfg-coverage --package credence_errors \
            --test discriminant_uniqueness \
            --test error_codes_wire \
            --lcov --output-path lcov-credence_errors.info

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: lcov-reports
          path: lcov-*.info
