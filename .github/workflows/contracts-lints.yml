name: Contracts Lints

on:
  push:
    branches:
      - main
      - master
      - develop
      - ci/**
    paths:
      - Cargo.toml
      - Cargo.lock
      - clippy.toml
      - rust-toolchain.toml
      - contracts/**
      - crates/**
      - scripts/**
      - .github/workflows/contracts-lints.yml
      - README.md
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - Cargo.toml
      - Cargo.lock
      - clippy.toml
      - rust-toolchain.toml
      - contracts/**
      - crates/**
      - scripts/**
      - .github/workflows/contracts-lints.yml
      - README.md
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pinned channel and components from rust-toolchain.toml.
      # The file already lists rustfmt, so no extra `components:` key needed.
      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: file

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test soroban-sdk pin checker
        run: python3 -m unittest scripts.tests.test_check_soroban_sdk_pin

      - name: Verify soroban-sdk pin
        run: python3 scripts/check_soroban_sdk_pin.py

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pinned channel and components from rust-toolchain.toml.
      # The file already lists clippy, so no extra `components:` key needed.
      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: file

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test soroban-sdk pin checker
        run: python3 -m unittest scripts.tests.test_check_soroban_sdk_pin

      - name: Verify soroban-sdk pin
        run: python3 scripts/check_soroban_sdk_pin.py

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
